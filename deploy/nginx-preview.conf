# Nginx site for the CertKraft page preview. See docs/DEPLOY.md, step 6.
# Copy to /etc/nginx/sites-available/preview and change server_name to your own domain. There is no sign-in.
server {
    listen 80;
    server_name preview.certkraft.com;

    root /var/www/preview;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
